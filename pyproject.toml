[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]


[tool.ruff.format]
# Форматирование по стандарту Black
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
