services:
  booking_db:
    image: postgres:16
    container_name: booking_db
    ports:
      - "6432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    networks:
      - myNetwork
    volumes:
      - pg-booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  booking_cache:
    image: redis:7.4
    container_name: booking_cache
    ports:
      - "7379:6379"
    networks:
      - myNetwork
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  booking_back_service:
    container_name: 'booking_back'
    build:
      context: .
    ports:
      - "2026:8000"
    networks:
      - myNetwork
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      booking_db:
        condition: service_healthy
      booking_cache:
        condition: service_healthy


  booking_celery_worker_service:
    container_name: 'booking_celery_worker'
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: "celery --app=src.tasks.celery_app:celery_inst worker -l INFO"
    depends_on:
      booking_db:
        condition: service_healthy
      booking_cache:
        condition: service_healthy
      booking_back_service:
        condition: service_started

  booking_celery_beat_service:
    container_name: 'booking_celery_beat'
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: "celery --app=src.tasks.celery_app:celery_inst beat -l INFO"
    depends_on:
      booking_db:
        condition: service_healthy
      booking_cache:
        condition: service_healthy
      booking_back_service:
        condition: service_started

networks:
  myNetwork:
    driver: bridge

volumes:
  pg-booking-data: